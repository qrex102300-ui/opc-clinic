name: Free Founder Bottleneck Triage
about: Get a free first-pass triage for a launched product with real evidence. No payment required.
title: "[Free Triage] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ## Free Founder Bottleneck Triage

        This is for founders who have already launched or tested something and have real evidence to inspect. The free triage gives you a short first pass: **most plausible bottleneck category → what evidence is missing → fit/no-fit for the deeper diagnosis**.

        It is not a full market-research report and no payment is required for the triage. If the case is accepted and you want the deeper evidence-backed pass, payment instructions are posted in the issue before work starts.

        This issue is public. **Sanitized numbers are fine** — you do not need to reveal customer identities, exact confidential revenue, or private company data. Ranges and ratios are enough when they still preserve the shape of the funnel. Please do not include passwords, API keys, private customer data, or other secrets.

  - type: input
    id: project
    attributes:
      label: Project / product
      description: What are you building or selling?
      placeholder: "e.g. AI bookkeeping assistant for small agencies"
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Public URL
      description: Website, product page, or public repository if available. Leave blank if you prefer not to share one publicly.
      placeholder: "https://..."
    validations:
      required: false

  - type: textarea
    id: customer
    attributes:
      label: Customer and offer
      description: Who is the customer and what are you asking them to buy?
      placeholder: "e.g. US bookkeeping agencies; $29/month assistant that categorizes client expenses"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: What has actually happened so far?
      description: Give facts, not hopes — users, revenue, traffic, calls, conversion, experiments, rejections, etc. Sanitized ranges or ratios are acceptable.
      placeholder: |
        - ~300 visits last 30 days
        - 15–20 signups
        - 0 paid users
        - 7 founder calls; 4 said X, 3 said Y
    validations:
      required: true

  - type: textarea
    id: stuck
    attributes:
      label: Your current hypothesis (optional)
      description: Where do you think you are stuck? Leave blank if you genuinely do not know.
    validations:
      required: false

  - type: textarea
    id: decision
    attributes:
      label: What decision must you make in the next 7 days?
      placeholder: "e.g. keep building onboarding vs stop and change positioning"
    validations:
      required: true

  - type: checkboxes
    id: agreement
    attributes:
      label: Agreement
      options:
        - label: I have removed secrets and private customer data from this issue.
          required: true
        - label: I understand the free triage is a short first pass, not a full market-research report and not a guarantee of acceptance.
          required: true
        - label: I understand the diagnosis is evidence-based advice, not a guarantee of revenue or business outcome.
          required: true
