name: Verify OPC Clinic in Skills Registry

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/register-gotskills.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Search public registry without another install
        shell: bash
        run: |
          set +e
          npx --yes skills search "opc clinic" --json > /tmp/gotskills-search.json 2>/tmp/gotskills-search.err
          code=$?
          echo "search_code=$code" > /tmp/gotskills-status.env
          exit 0

      - name: Write verification audit
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/gotskills-status.env
          mkdir -p ops
          {
            echo '# Skills Registry / gotskills acquisition verification'
            echo
            echo "Last checked: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo 'The registry documentation says public GitHub skills are added on first install. One install attempt was made earlier in this sprint. This workflow is verification-only to avoid inflating install counts.'
            echo 'Repository: https://github.com/qrex102300-ui/opc-clinic'
            echo 'Skill path: skill/SKILL.md'
            echo
            echo "Registry search exit code: $search_code"
            echo
            echo '```json'
            if [ -s /tmp/gotskills-search.json ]; then
              head -c 12000 /tmp/gotskills-search.json
            else
              cat /tmp/gotskills-search.err || true
            fi
            echo
            echo '```'
          } > ops/gotskills-registration.md

      - name: Commit verification audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/gotskills-registration.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record skills registry verification'
          git pull --rebase origin main
          git push
