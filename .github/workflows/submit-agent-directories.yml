name: Submit OPC Clinic to Agent Directories

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/submit-agent-directories.yml"

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Submit to zero-cost agent directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops

          agent_directory_payload='{
            "name": "OPC Clinic",
            "handle": "opc-clinic",
            "tagline": "Evidence-first AI founder diagnostician for products that launched but are not converting.",
            "description": "Open-source, model-agnostic founder diagnosis skill that traces post-launch symptoms to a likely bottleneck, anchors conclusions to supplied facts, and turns the diagnosis into a measurable 7-day test.",
            "website_url": "https://qrex102300-ui.github.io/opc-clinic/",
            "capabilities": ["startup root-cause diagnosis", "post-launch bottleneck triage", "7-day experiment design", "multi-turn evidence interrogation"],
            "skills": ["business-diagnosis", "startup-triage", "experiment-design", "market-research"],
            "stack": ["static web", "model-agnostic LLM prompt", "GitHub Issues"]
          }'
          agent_directory_body="$(mktemp)"
          agent_directory_code="$(curl -sS -L -o "$agent_directory_body" -w '%{http_code}' \
            -X POST 'https://agent-directory-api.vercel.app/api/agents' \
            -H 'Content-Type: application/json' \
            --data "$agent_directory_payload")"
          test "$agent_directory_code" = "200" -o "$agent_directory_code" = "201" -o "$agent_directory_code" = "409"

          agents_launch_payload='{
            "name": "OPC Clinic",
            "tagline": "Evidence-first founder diagnosis for launched products that are not converting.",
            "description": "Open-source AI diagnostician for solo founders. It uses multi-turn evidence interrogation to identify the most plausible post-launch bottleneck and define a measurable 7-day test instead of returning generic advice.",
            "website_url": "https://qrex102300-ui.github.io/opc-clinic/",
            "category": "productivity",
            "pricing": "freemium"
          }'
          agents_launch_body="$(mktemp)"
          agents_launch_code="$(curl -sS -L -o "$agents_launch_body" -w '%{http_code}' \
            -X POST 'https://agents-launch.lovable.app/api/public/v1/agents' \
            -H 'Content-Type: application/json' \
            --data "$agents_launch_payload")"
          test "$agents_launch_code" = "200" -o "$agents_launch_code" = "201" -o "$agents_launch_code" = "409"

          openagentskill_payload='{
            "repository": "https://github.com/qrex102300-ui/opc-clinic",
            "skillPath": "skill/SKILL.md",
            "category": "productivity",
            "tags": ["startup", "founder", "diagnosis", "business", "experiment-design"],
            "submissionSource": "agent",
            "submittedByAgent": "chatgpt-revenue-sprint"
          }'
          openagentskill_body="$(mktemp)"
          openagentskill_code="$(curl -sS -L -o "$openagentskill_body" -w '%{http_code}' \
            -X POST 'https://www.openagentskill.com/api/skills/submit' \
            -H 'Content-Type: application/json' \
            --data "$openagentskill_payload")"
          if jq -e . "$openagentskill_body" >/dev/null 2>&1; then
            openagentskill_safe="$(jq -c 'del(.submission.token, .submission.statusUrl, .token, .statusUrl)' "$openagentskill_body")"
          else
            openagentskill_safe='{"response":"non-JSON response omitted from public audit"}'
          fi

          {
            echo '# Agent directory submission audit'
            echo
            echo "Last attempted: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo 'These submissions use public, no-auth endpoints and no paid placement.'
            echo
            echo '## Agent Directory API'
            echo
            echo "HTTP status: $agent_directory_code"
            echo
            echo '```json'
            cat "$agent_directory_body"
            echo
            echo '```'
            echo
            echo '## agents-launch'
            echo
            echo "HTTP status: $agents_launch_code"
            echo
            echo '```json'
            cat "$agents_launch_body"
            echo
            echo '```'
            echo
            echo '## OpenAgentSkill'
            echo
            echo "HTTP status: $openagentskill_code"
            echo
            echo 'The receipt below is sanitized: submission tokens/status URLs are removed before anything is written to the public repository.'
            echo
            echo '```json'
            echo "$openagentskill_safe"
            echo '```'
          } > ops/agent-directory-submissions.md

      - name: Commit audit record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/agent-directory-submissions.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record agent directory submission results'
          git push
