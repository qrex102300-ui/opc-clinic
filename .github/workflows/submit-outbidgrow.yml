name: Submit OPC Clinic to outbidgrow free directory

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/submit-outbidgrow.yml"

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Playwright with runner browser
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo 'No preinstalled Chromium-family browser found on the runner.' >&2
            exit 1
          fi
          echo "BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"

      - name: Submit free listing through designated public form
        shell: bash
        run: |
          set -euo pipefail
          cat > submit-outbidgrow.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const projectUrl = 'https://qrex102300-ui.github.io/opc-clinic/';
          const projectDomain = 'qrex102300-ui.github.io/opc-clinic';
          const result = {
            surface: 'https://outbidgrow.lol/',
            projectUrl,
            attempted: true,
            usedIdentity: false,
            usedEmail: false,
            usedPayment: false,
            freeButtonClicked: false,
            modalOpened: false,
            modalSubmitted: false,
            successSignal: false,
            liveSignal: false,
            finalUrl: '',
            bodyText: '',
            error: null
          };

          const browser = await chromium.launch({
            headless: true,
            executablePath: process.env.BROWSER_EXECUTABLE,
            args: ['--no-sandbox']
          });
          const page = await browser.newPage({ viewport: { width: 1365, height: 1000 } });

          try {
            await page.goto(result.surface, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(1500);
            const initial = (await page.locator('body').innerText()).slice(0, 12000);
            if (/captcha|turnstile|verify you are human|cloudflare challenge/i.test(initial)) {
              throw new Error('Human-verification challenge detected; stopped without bypassing it.');
            }

            // The top free button opens the site's own $0 listing modal.
            const topUrl = page.locator('input[placeholder*="product URL" i], input[placeholder*="handle" i], input[type="url"]').first();
            if (await topUrl.count()) await topUrl.fill(projectUrl);

            const topCategory = page.locator('select').first();
            if (await topCategory.count()) {
              const options = await topCategory.locator('option').allTextContents();
              const ai = options.find(x => /AI Agents & Infrastructure/i.test(x));
              if (ai) await topCategory.selectOption({ label: ai });
            }

            const free = page.getByRole('button', { name: /^Free\s*\(\$0\)$/i }).first();
            if (!(await free.count())) throw new Error('Free ($0) submission button not found.');
            await free.click({ timeout: 30000 });
            result.freeButtonClicked = true;
            await page.waitForTimeout(1000);

            const modalTitle = page.getByText(/List Your Website \(Free\)/i).first();
            if (!(await modalTitle.count()) || !(await modalTitle.isVisible())) {
              throw new Error('Expected free-listing modal did not open.');
            }
            result.modalOpened = true;

            // Scope to the visible modal so the background Free button cannot intercept the final click.
            const overlay = modalTitle.locator('xpath=ancestor::div[contains(@class,"fixed") and contains(@class,"inset-0")][1]');
            const modal = (await overlay.count()) ? overlay : page.locator('div.fixed.inset-0.z-50').last();

            const inputs = modal.locator('input');
            const inputCount = await inputs.count();
            for (let i = 0; i < inputCount; i++) {
              const el = inputs.nth(i);
              if (!(await el.isVisible()) || !(await el.isEditable())) continue;
              const type = (await el.getAttribute('type') || 'text').toLowerCase();
              const ph = (await el.getAttribute('placeholder') || '').toLowerCase();
              const name = (await el.getAttribute('name') || '').toLowerCase();
              const value = await el.inputValue();
              if (/url|handle|website/.test(ph + ' ' + name) || type === 'url') {
                await el.fill(projectUrl);
              } else if (/tagline|description/.test(ph + ' ' + name)) {
                await el.fill('Evidence-backed AI founder diagnosis for post-launch bottlenecks.');
              } else if (type === 'number' || /bid|amount|usd/.test(ph + ' ' + name)) {
                await el.fill('0');
              } else if (!value && type === 'text') {
                // The modal has only public project metadata fields; the remaining empty text field is the tagline.
                await el.fill('Evidence-backed AI founder diagnosis for post-launch bottlenecks.');
              }
            }

            const modalSelect = modal.locator('select').first();
            if (await modalSelect.count()) {
              const options = await modalSelect.locator('option').allTextContents();
              const ai = options.find(x => /AI Agents & Infrastructure/i.test(x));
              if (ai) await modalSelect.selectOption({ label: ai });
            }

            const finalSubmit = modal.getByRole('button', { name: /Submit Website for Free \(\$0\)/i }).first();
            if (!(await finalSubmit.count())) throw new Error('Modal free-submit button not found.');
            await finalSubmit.click({ timeout: 30000 });
            result.modalSubmitted = true;
            await page.waitForTimeout(5000);

            result.finalUrl = page.url();
            let body = (await page.locator('body').innerText()).slice(0, 18000);
            const blocked = /captcha|turnstile|verify you are human|cloudflare challenge/i.test(body);
            result.successSignal = !blocked && /success|submitted|listed|live|added|already listed|permanent/i.test(body)
              && !/error|failed|invalid|required.*email|required.*name|payment required/i.test(body);

            // Independently verify the public directory after submission; only this can make liveSignal true.
            await page.goto(result.surface, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(2500);
            body = (await page.locator('body').innerText()).slice(0, 24000);
            result.bodyText = body;
            result.liveSignal = body.toLowerCase().includes(projectDomain.toLowerCase());
            if (result.liveSignal) result.successSignal = true;
          } catch (err) {
            result.error = String(err?.message || err);
            try {
              result.finalUrl = page.url();
              result.bodyText = (await page.locator('body').innerText()).slice(0, 18000);
            } catch {}
          } finally {
            await page.close();
            await browser.close();
          }

          fs.writeFileSync('/tmp/outbidgrow-result.json', JSON.stringify(result, null, 2));
          EOF

          node submit-outbidgrow.mjs || true
          rm -f submit-outbidgrow.mjs

      - name: Write sanitized acquisition audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          {
            echo '# outbidgrow free-directory submission audit'
            echo
            echo "Last attempted: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo 'Surface: https://outbidgrow.lol/ — designated startup/SaaS free-listing form advertising a permanent $0 listing with no account creation.'
            echo 'Only the public project URL and public project metadata were supplied. The bid amount was kept at $0. No email, personal identity, account, card, payment, private credential, or unrelated community message was used.'
            echo
            echo '```json'
            jq . /tmp/outbidgrow-result.json
            echo '```'
          } > ops/outbidgrow-submission.md

      - name: Commit acquisition audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/outbidgrow-submission.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record outbidgrow free listing attempt'
          git pull --rebase origin main
          git push
