name: Submit OPC Clinic to Outbid Grow

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/submit-outbidgrow.yml"

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then echo 'No Chromium-family browser found.' >&2; exit 1; fi
          echo "BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"

      - name: Submit identity-free free listing
        shell: bash
        run: |
          set -euo pipefail
          cat > submit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const r = {
            surface: 'https://outbidgrow.lol/',
            attempted: true,
            submitted: false,
            confirmedLive: false,
            blockedByIdentity: false,
            blockedByHumanVerification: false,
            error: null,
            finalUrl: null,
            bodyText: ''
          };

          const browser = await chromium.launch({
            headless: true,
            executablePath: process.env.BROWSER_EXECUTABLE,
            args: ['--no-sandbox']
          });
          const page = await browser.newPage({viewport:{width:1365,height:1000}});
          try {
            await page.goto(r.surface, {waitUntil:'domcontentloaded', timeout:60000});
            await page.waitForTimeout(2000);
            let body = await page.locator('body').innerText();
            if (/captcha|turnstile|hcaptcha|verify you are human|cloudflare challenge/i.test(body)) {
              r.blockedByHumanVerification = true;
              throw new Error('Human-verification gate detected; no bypass attempted.');
            }

            const required = page.locator('input[required], textarea[required], select[required]');
            for (let i=0; i<await required.count(); i++) {
              const el = required.nth(i);
              const meta = [await el.getAttribute('name'), await el.getAttribute('id'), await el.getAttribute('placeholder'), await el.getAttribute('aria-label'), await el.getAttribute('type')].filter(Boolean).join(' ').toLowerCase();
              if (/email|e-mail|your name|founder|owner name|contact name|phone/.test(meta)) {
                r.blockedByIdentity = true;
                throw new Error(`Required identity/contact field detected: ${meta}`);
              }
            }

            const inputs = page.locator('input');
            let urlFilled = false;
            let taglineFilled = false;
            for (let i=0; i<await inputs.count(); i++) {
              const el = inputs.nth(i);
              if (!await el.isVisible().catch(()=>false) || !await el.isEditable().catch(()=>false)) continue;
              const meta = [await el.getAttribute('name'), await el.getAttribute('id'), await el.getAttribute('placeholder'), await el.getAttribute('aria-label'), await el.getAttribute('type')].filter(Boolean).join(' ').toLowerCase();
              if (!urlFilled && (/product url|website|domain|url|handle/.test(meta) || (await el.getAttribute('type')) === 'url')) {
                await el.fill('https://qrex102300-ui.github.io/opc-clinic/');
                urlFilled = true;
                continue;
              }
              if (!taglineFilled && /tagline|one.?line|pitch|description/.test(meta)) {
                await el.fill('Evidence-backed founder diagnosis for launched products stuck before revenue.');
                taglineFilled = true;
              }
            }

            const textareas = page.locator('textarea');
            if (!taglineFilled && await textareas.count()) {
              const el = textareas.first();
              if (await el.isVisible() && await el.isEditable()) {
                await el.fill('Evidence-backed founder diagnosis for launched products stuck before revenue.');
                taglineFilled = true;
              }
            }

            const selects = page.locator('select');
            if (await selects.count()) {
              for (let i=0; i<await selects.count(); i++) {
                const sel = selects.nth(i);
                const opts = await sel.locator('option').allTextContents();
                let idx = opts.findIndex(x => /^\s*AI\s*$/i.test(x));
                if (idx < 0) idx = opts.findIndex(x => /artificial intelligence|ai tools|saas|startup/i.test(x));
                if (idx >= 0) { await sel.selectOption({index:idx}); break; }
              }
            }

            if (!urlFilled) throw new Error('Could not find public product URL/domain input.');

            const freeBtn = page.getByRole('button', {name:/free\s*\(\$0\)|submit free|free listing/i}).first();
            if (!await freeBtn.count()) throw new Error('Free listing button not found.');
            if (!await freeBtn.isEnabled()) throw new Error('Free listing button remained disabled after public fields were filled.');
            await freeBtn.click({timeout:30000});
            await page.waitForTimeout(6000);

            r.submitted = true;
            r.finalUrl = page.url();
            r.bodyText = (await page.locator('body').innerText()).slice(0,12000);
            const combined = `${r.finalUrl}\n${r.bodyText}`;
            const fail = /error|failed|invalid|required|already exists|duplicate/i.test(combined);
            const success = /listed|live|success|submitted|thank you|leaderboard/i.test(combined);
            r.confirmedLive = success && !fail;
          } catch (e) {
            r.error = String(e?.message || e);
            try {
              r.finalUrl = page.url();
              r.bodyText = (await page.locator('body').innerText()).slice(0,12000);
            } catch {}
          } finally {
            fs.writeFileSync('/tmp/outbidgrow.json', JSON.stringify(r, null, 2));
            await browser.close();
          }
          EOF
          node submit.mjs || true
          rm -f submit.mjs

      - name: Write acquisition audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          {
            echo '# Outbid Grow acquisition submission'
            echo
            echo "Attempted: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo 'Designated public free-listing surface only. No account, identity, email, payment, private credential, unsolicited comment, or human-verification bypass was used.'
            echo
            echo '```json'
            jq . /tmp/outbidgrow.json
            echo '```'
          } > ops/outbidgrow-submission.md

      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/outbidgrow-submission.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Outbid Grow acquisition submission'
          git pull --rebase origin main
          git push
