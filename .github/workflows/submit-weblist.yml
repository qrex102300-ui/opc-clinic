name: Submit OPC Clinic to WebList

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/submit-weblist.yml"

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Submit through documented public API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          body="$(mktemp)"
          payload='{
            "url": "https://qrex102300-ui.github.io/opc-clinic/",
            "name": "OPC Clinic",
            "description": "Open-source AI founder diagnostician for launched products that are stuck: traces symptoms to a likely bottleneck and turns the diagnosis into a measurable 7-day test.",
            "category": "ai-agent",
            "language": "en",
            "tags": "startup,founder,diagnosis,business,experiment-design"
          }'
          code="$(curl -sS -L -o "$body" -w '%{http_code}' \
            -X POST 'https://appli.st/api/submit' \
            -H 'Content-Type: application/json' \
            --data "$payload")"

          {
            echo '# WebList acquisition submission audit'
            echo
            echo "Last attempted: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo 'Surface: https://appli.st/ — open CC0 website directory with a documented POST /api/submit endpoint for AI agents.'
            echo 'No account, email, payment, private credential, or identity claim was supplied.'
            echo 'Submitted URL: https://qrex102300-ui.github.io/opc-clinic/'
            echo 'Requested category: ai-agent'
            echo
            echo "HTTP status: $code"
            echo
            echo '```json'
            if jq -e . "$body" >/dev/null 2>&1; then
              jq . "$body"
            else
              head -c 8000 "$body" || true
            fi
            echo
            echo '```'
          } > ops/weblist-submission.md

      - name: Commit acquisition audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/weblist-submission.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record WebList directory submission'
          git pull --rebase origin main
          git push
