name: Submit OPC Clinic to DiscoverAISkills

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/submit-free-directories-round6.yml"

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then echo 'No Chromium-family browser found.' >&2; exit 1; fi
          echo "BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"

      - name: Submit only if the advertised no-email route is truly identity-free
        shell: bash
        run: |
          set -euo pipefail
          cat > round6.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const product={
            name:'OPC Clinic',
            repo:'https://github.com/qrex102300-ui/opc-clinic',
            url:'https://qrex102300-ui.github.io/opc-clinic/',
            description:'Open-source founder-diagnosis prompt and Claude Code skill for launched products stuck before revenue. It interrogates symptoms until it reaches a fact-backed bottleneck, then forces a measurable next experiment instead of generic advice.'
          };
          const r={surface:'DiscoverAISkills',attempted:true,submitted:false,successSignal:false,skippedForIdentity:false,identityFields:[],blockedByHumanVerification:false,finalUrl:null,error:null,missingRequired:[],bodyText:''};
          const browser=await chromium.launch({headless:true,executablePath:process.env.BROWSER_EXECUTABLE,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});

          async function meta(el){
            const id=await el.getAttribute('id');let label='';
            if(id) label=await page.locator(`label[for="${id.replaceAll('"','\\"')}"]`).first().innerText().catch(()=> '');
            return [label,await el.getAttribute('aria-label'),await el.getAttribute('placeholder'),await el.getAttribute('name'),await el.getAttribute('type')].filter(Boolean).join(' ').toLowerCase();
          }
          async function gate(){
            const els=page.locator('input[required],textarea[required],select[required]');const out=[];
            for(let i=0;i<await els.count();i++){const m=await meta(els.nth(i));if(/\bemail\b|e-mail|your name|founder|maker|owner|contact name|submitted by|linkedin|twitter|x handle/.test(m))out.push(m);}
            return out;
          }
          async function fill(selectors,value){for(const s of selectors){try{const l=typeof s==='string'?page.locator(s):s;if(await l.count()){const e=l.first();if(await e.isVisible()&&await e.isEditable()){await e.fill(value);await e.press('Tab').catch(()=>{});return true;}}}catch{}}return false;}
          async function choose(pattern){const sels=page.locator('select');for(let i=0;i<await sels.count();i++){const s=sels.nth(i);const opts=await s.locator('option').allTextContents();let idx=opts.findIndex(x=>pattern.test(x));if(idx>=0){await s.selectOption({index:idx}).catch(()=>{});return true;}}return false;}
          async function missing(){const els=page.locator('input[required],textarea[required],select[required]');const out=[];for(let i=0;i<await els.count();i++){const e=els.nth(i);if(!(await e.isVisible().catch(()=>false)))continue;const t=(await e.getAttribute('type')||'').toLowerCase();if(['checkbox','radio'].includes(t)){if(!(await e.isChecked().catch(()=>false)))out.push(await meta(e));continue;}const v=await e.inputValue().catch(()=> '');if(!String(v).trim())out.push(await meta(e));}return out;}

          try{
            await page.goto('https://discoveraiskills.com/contact',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(2000);
            let body=(await page.locator('body').innerText()).slice(0,15000);
            if(!/submit.*skill/i.test(body))throw new Error('Advertised Submit a Skill route not visible from contact page.');
            const link=page.getByRole('link',{name:/submit a skill/i}).first();
            if(!(await link.count()))throw new Error('Submit a Skill link not found.');
            await link.click({timeout:15000});await page.waitForTimeout(2200);
            body=(await page.locator('body').innerText()).slice(0,15000);
            r.finalUrl=page.url();
            if(/captcha|turnstile|verify you are human|cloudflare challenge|hcaptcha|recaptcha/i.test(body)){r.blockedByHumanVerification=true;throw new Error('Human-verification gate detected; no bypass attempted.');}
            r.identityFields=await gate();
            if(r.identityFields.length){r.skippedForIdentity=true;r.bodyText=body;throw new Error('Required identity/contact field detected; no submission attempted.');}

            await fill([page.getByLabel(/skill name|name of.*skill/i),'input[name*="skill" i][name*="name" i]'],product.name);
            await fill([page.getByLabel(/github|repository|repo url|skill url|source url/i),'input[name*="github" i]','input[name*="repo" i]'],product.repo);
            await fill([page.getByLabel(/website|homepage|project url/i),'input[name*="website" i]','input[name*="homepage" i]'],product.url);
            await fill([page.getByLabel(/description|what.*skill|about.*skill/i),'textarea[name*="description" i]','textarea'],product.description);
            await choose(/business|productivity|workflow|research|other/i);

            r.identityFields=await gate();
            if(r.identityFields.length){r.skippedForIdentity=true;r.bodyText=(await page.locator('body').innerText()).slice(0,15000);throw new Error('Required identity/contact field appeared after form progress; no submission attempted.');}
            r.missingRequired=await missing();
            if(r.missingRequired.length)throw new Error('Unknown or consent required fields remain; no guessing/consent bypass attempted.');

            const btn=page.getByRole('button',{name:/submit.*skill|submit|send/i}).first();
            if(!(await btn.count()))throw new Error('Submit control not found.');
            if(!(await btn.isEnabled().catch(()=>false)))throw new Error('Submit control disabled; no bypass attempted.');
            await page.waitForTimeout(1800);await btn.click({timeout:30000});await page.waitForTimeout(5000);
            r.submitted=true;r.finalUrl=page.url();r.bodyText=(await page.locator('body').innerText()).slice(0,15000);
            const all=`${r.finalUrl}\n${r.bodyText}`;
            const failure=/error|invalid|failed|sign in|log in|payment required/i.test(all);
            r.successSignal=/thank|submitted|submission received|review|success|received/i.test(r.bodyText)&&!failure;
          }catch(e){r.error=String(e?.message||e);try{r.finalUrl=page.url();r.bodyText=(await page.locator('body').innerText()).slice(0,15000);}catch{}}
          finally{await page.close();await browser.close();fs.writeFileSync('/tmp/round6.json',JSON.stringify(r,null,2));}
          EOF
          node round6.mjs || true
          rm -f round6.mjs

      - name: Write acquisition audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          {
            echo '# DiscoverAISkills acquisition attempt'
            echo
            echo "Last attempted: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo 'DiscoverAISkills publicly states that its skill submission form needs no email. This run still re-checked the live flow and was constrained to stop on identity, login, payment, human verification, consent, or unknown required fields.'
            echo
            echo '```json'
            jq . /tmp/round6.json
            echo '```'
          } > ops/discoveraiskills-submission.md

      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/discoveraiskills-submission.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record DiscoverAISkills acquisition attempt'
          git pull --rebase origin main
          git push
