name: Submit OPC Clinic to AllWebList

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/submit-allweblist.yml"

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then echo 'No Chromium-family browser found.' >&2; exit 1; fi
          echo "BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"

      - name: Submit public product facts only
        shell: bash
        run: |
          set -euo pipefail
          cat > allweblist.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const result = {
            surface: 'https://www.allweblist.org/submit',
            attempted: true,
            submitted: false,
            successSignal: false,
            skippedForIdentity: false,
            blockedByHumanVerification: false,
            finalUrl: null,
            error: null,
            bodyText: ''
          };

          const product = {
            title: 'OPC Clinic',
            url: 'https://qrex102300-ui.github.io/opc-clinic/',
            description: 'Open-source AI founder diagnostician for launched products stuck before revenue. It traces the likely bottleneck to supplied facts and current market evidence, then turns it into a measurable 7-day experiment.',
            tags: 'AI, SaaS, startup, founder diagnosis'
          };

          const browser = await chromium.launch({
            headless: true,
            executablePath: process.env.BROWSER_EXECUTABLE,
            args: ['--no-sandbox']
          });
          const page = await browser.newPage({ viewport: { width: 1365, height: 1000 } });

          try {
            await page.goto(result.surface, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(1500);
            let body = await page.locator('body').innerText();

            if (/captcha|turnstile|verify you are human|cloudflare challenge|hcaptcha/i.test(body)) {
              result.blockedByHumanVerification = true;
              throw new Error('Human-verification gate detected; no bypass attempted.');
            }

            const required = page.locator('input[required], textarea[required], select[required]');
            for (let i = 0; i < await required.count(); i++) {
              const el = required.nth(i);
              const meta = [
                await el.getAttribute('name'),
                await el.getAttribute('id'),
                await el.getAttribute('placeholder'),
                await el.getAttribute('aria-label'),
                await el.getAttribute('type')
              ].filter(Boolean).join(' ').toLowerCase();
              if (/email|e-mail|your name|founder name|owner name|contact name|submitted by|phone|twitter|linkedin/.test(meta)) {
                result.skippedForIdentity = true;
                throw new Error(`Required identity/contact field detected: ${meta}`);
              }
            }

            const fillFirst = async (selectors, value) => {
              for (const selector of selectors) {
                const loc = page.locator(selector).first();
                if (await loc.count() && await loc.isVisible() && await loc.isEditable()) {
                  await loc.fill(value);
                  return true;
                }
              }
              return false;
            };

            const titleOk = await fillFirst(['input[name*="title" i]', 'input[placeholder*="title" i]'], product.title);
            const urlOk = await fillFirst(['input[type="url"]', 'input[name*="url" i]', 'input[placeholder*="https" i]'], product.url);
            const descOk = await fillFirst(['textarea[name*="description" i]', 'textarea'], product.description);
            await fillFirst(['input[name*="tag" i]', 'input[placeholder*="tag" i]'], product.tags);
            if (!titleOk || !urlOk || !descOk) throw new Error(`Required public fields missing (title=${titleOk}, url=${urlOk}, description=${descOk}).`);

            const select = page.locator('select').first();
            if (await select.count()) {
              const options = await select.locator('option').allTextContents();
              let idx = options.findIndex(x => /technology/i.test(x));
              if (idx < 0) idx = options.findIndex(x => /business|other/i.test(x));
              if (idx < 0) throw new Error('No suitable category option found.');
              await select.selectOption({ index: idx });
            } else {
              throw new Error('Category selector not found.');
            }

            // This checkbox is an objective content-policy attestation about the listed website,
            // not a personal identity claim. OPC Clinic contains none of the prohibited categories.
            const policy = page.getByText(/I confirm that my website does not contain adult content, gambling content, or any illegal material/i).first();
            if (await policy.count()) {
              const checkbox = page.locator('input[type="checkbox"]').first();
              if (!(await checkbox.count())) throw new Error('Content-policy checkbox label found but checkbox missing.');
              await checkbox.check();
            } else {
              throw new Error('Expected content-policy statement not found; no unknown consent accepted.');
            }

            const button = page.getByRole('button', { name: /submit website/i }).first();
            if (!(await button.count())) throw new Error('Submit Website button not found.');
            if (!(await button.isEnabled())) throw new Error('Submit Website button is disabled.');
            await button.click({ timeout: 30000 });
            await page.waitForTimeout(4000);

            result.submitted = true;
            result.finalUrl = page.url();
            result.bodyText = (await page.locator('body').innerText()).slice(0, 12000);
            result.blockedByHumanVerification = /captcha|turnstile|verify you are human|cloudflare challenge|hcaptcha/i.test(result.bodyText);
            result.successSignal = /Success! Your Website is Live!|published instantly|now visible in our directory/i.test(result.bodyText) && !result.blockedByHumanVerification;
            if (!result.successSignal) throw new Error('Submission completed without an explicit live-listing success signal.');
          } catch (e) {
            result.error = String(e?.message || e);
            try {
              result.finalUrl = page.url();
              if (!result.bodyText) result.bodyText = (await page.locator('body').innerText()).slice(0, 12000);
            } catch {}
          } finally {
            fs.writeFileSync('/tmp/allweblist.json', JSON.stringify(result, null, 2));
            await page.close();
            await browser.close();
          }
          EOF
          node allweblist.mjs || true
          rm -f allweblist.mjs

      - name: Write acquisition audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          {
            echo '# AllWebList acquisition submission'
            echo
            echo "Last attempted: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo 'Only public product facts were submitted. No account, email/person identity, payment, private credential, unsolicited comment, or human-verification bypass was used.'
            echo
            echo '```json'
            jq . /tmp/allweblist.json
            echo '```'
          } > ops/allweblist-submission.md

      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/allweblist-submission.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record AllWebList acquisition submission'
          git pull --rebase origin main
          git push
