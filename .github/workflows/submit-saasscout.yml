name: Submit OPC Clinic to SaaS Scout

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/submit-saasscout.yml"

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Submit through documented public no-login API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          website='https://qrex102300-ui.github.io/opc-clinic/'
          lookup_body="$(mktemp)"
          lookup_code="$(curl -sS -L -o "$lookup_body" -w '%{http_code}' 'https://saasscout.org/api/products?search=OPC%20Clinic&limit=100')"

          body="$(mktemp)"
          if [ "$lookup_code" = "200" ] && jq -e --arg website "$website" '.[]? | select((.website // "") == $website or (.website // "") == ($website | rtrimstr("/")))' "$lookup_body" >/dev/null 2>&1; then
            code='already-listed'
            jq -c --arg website "$website" '[.[]? | select((.website // "") == $website or (.website // "") == ($website | rtrimstr("/")))]' "$lookup_body" > "$body"
          else
            payload='{
              "name":"OPC Clinic",
              "tagline":"Evidence-first founder diagnosis for launched products that are not converting.",
              "description":"OPC Clinic is an open-source AI founder diagnostician for solo founders and small teams. It uses evidence-backed questioning to identify the most plausible post-launch bottleneck, then turns that diagnosis into a measurable 7-day experiment instead of generic startup advice.",
              "website":"https://qrex102300-ui.github.io/opc-clinic/",
              "category":"AI"
            }'
            code="$(curl -sS -L -o "$body" -w '%{http_code}' \
              -X POST 'https://saasscout.org/api/products' \
              -H 'Content-Type: application/json' \
              --data "$payload")"
          fi

          {
            echo '# SaaS Scout acquisition submission audit'
            echo
            echo "Attempted: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo 'Surface: https://saasscout.org — public SaaS directory for founders and early adopters.'
            echo 'The site publicly states that no login is needed to submit. Its product API validator requires name, tagline, description, website, and category and does not require email.'
            echo 'No account, email, payment, private credential, or personal identity was supplied.'
            echo
            echo "Result status: $code"
            echo
            echo '```json'
            if jq -e . "$body" >/dev/null 2>&1; then jq -c . "$body"; else head -c 4000 "$body"; fi
            echo
            echo '```'
          } > ops/saasscout-submission.md

          if [ "$code" != 'already-listed' ]; then
            case "$code" in
              200|201|202) ;;
              *) echo "SaaS Scout submission was not accepted (HTTP $code)" >&2 ;;
            esac
          fi

      - name: Commit audit record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/saasscout-submission.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record SaaS Scout acquisition submission'
          git push
