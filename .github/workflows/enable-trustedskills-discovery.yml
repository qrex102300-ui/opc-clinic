name: Enable TrustedSkills discovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/enable-trustedskills-discovery.yml"

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add openclaw-skill topic without removing existing topics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/topics"
          current=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")
          names=$(printf '%s' "$current" | jq -c '.names + ["openclaw-skill"] | unique')
          printf '{"names":%s}\n' "$names" > /tmp/topics-payload.json
          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            --data-binary @/tmp/topics-payload.json > /tmp/topics-result.json

      - name: Write acquisition audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          {
            echo '# TrustedSkills discovery enrollment'
            echo
            echo "Executed: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo 'Purpose: enroll OPC Clinic in the documented TrustedSkills zero-cost auto-discovery path without using owner identity, email, private credentials, paid placement, or community promotion.'
            echo
            echo 'TrustedSkills documents that a public repository with a registry-compatible `SKILL.md` and the `openclaw-skill` GitHub topic is eligible for automatic discovery; discovery may take up to six hours. This audit records only the repository-side eligibility action. It does **not** count TrustedSkills as a confirmed public listing until an independent public registry lookup shows OPC Clinic.'
            echo
            echo '## Repository topic response'
            echo
            echo '```json'
            jq '{names}' /tmp/topics-result.json
            echo '```'
            echo
            echo 'Skill path: `skill/SKILL.md`'
            echo 'Declared version: `1.0.0`'
            echo 'Declared platforms: `openclaw`, `claude`, `openai`'
          } > ops/trustedskills-discovery.md

      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/trustedskills-discovery.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record TrustedSkills discovery enrollment'
          git pull --rebase origin main
          git push
