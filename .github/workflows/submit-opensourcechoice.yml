name: Submit OPC Clinic to OpenSourceChoice

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/submit-opensourcechoice.yml"

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then echo 'No Chromium-family browser found.' >&2; exit 1; fi
          echo "BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"

      - name: Submit public open-source project facts
        shell: bash
        run: |
          set -euo pipefail
          cat > submit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const r = {
            surface: 'https://opensourcechoice.com/',
            attempted: true,
            submitted: false,
            successSignal: false,
            blockedByIdentity: false,
            blockedByHumanVerification: false,
            error: null,
            finalUrl: null,
            bodyText: ''
          };
          const browser = await chromium.launch({headless:true, executablePath:process.env.BROWSER_EXECUTABLE, args:['--no-sandbox']});
          const page = await browser.newPage({viewport:{width:1365,height:1100}});

          async function fillLabel(re, value) {
            const loc = page.getByLabel(re).first();
            if (await loc.count() && await loc.isVisible().catch(()=>false) && await loc.isEditable().catch(()=>false)) {
              await loc.fill(value); return true;
            }
            return false;
          }

          try {
            await page.goto(r.surface, {waitUntil:'domcontentloaded', timeout:60000});
            await page.waitForTimeout(1500);
            const body = await page.locator('body').innerText();
            if (/captcha|turnstile|hcaptcha|verify you are human|cloudflare challenge/i.test(body)) {
              r.blockedByHumanVerification = true;
              throw new Error('Human-verification gate detected; no bypass attempted.');
            }

            const btn = page.getByRole('button',{name:/submit free/i}).first();
            if (!await btn.count()) throw new Error('Submit free button not found.');
            const form = btn.locator('xpath=ancestor::form[1]');
            if (!await form.count()) throw new Error('Project submission form not found.');

            // Guardrail applies only to the project submission form, not unrelated newsletter fields elsewhere on the page.
            const required = form.locator('input[required], textarea[required], select[required]');
            for (let i=0; i<await required.count(); i++) {
              const el = required.nth(i);
              const meta = [await el.getAttribute('name'),await el.getAttribute('id'),await el.getAttribute('placeholder'),await el.getAttribute('aria-label'),await el.getAttribute('type')].filter(Boolean).join(' ').toLowerCase();
              if (/email|e-mail|your name|founder name|owner name|contact name|phone/.test(meta)) {
                r.blockedByIdentity = true;
                throw new Error(`Required identity/contact field detected inside project form: ${meta}`);
              }
            }

            const nameOk = await fillLabel(/project name/i, 'OPC Clinic') || await (async()=>{const x=form.locator('input[placeholder="Project name"]'); if(await x.count()){await x.fill('OPC Clinic');return true;} return false;})();
            const repoOk = await fillLabel(/github repository/i, 'https://github.com/qrex102300-ui/opc-clinic') || await (async()=>{const x=form.locator('input[placeholder*="github.com" i]'); if(await x.count()){await x.fill('https://github.com/qrex102300-ui/opc-clinic');return true;} return false;})();
            await fillLabel(/official website/i, 'https://qrex102300-ui.github.io/opc-clinic/');
            const whatOk = await fillLabel(/what does it do/i, 'Open-source AI founder diagnostician that identifies the evidence-backed revenue bottleneck in a launched product and turns it into a measurable 7-day experiment.');
            await fillLabel(/^replaces$/i, 'Generic founder advice and unguided startup diagnosis');
            await fillLabel(/tech stack/i, 'Static HTML, JavaScript, Markdown, GitHub Pages');
            await fillLabel(/key features/i, 'Evidence-backed diagnosis, contradiction check, bottleneck triage, measurable 7-day experiments');

            const selects = form.locator('select');
            let licenseOk = false;
            for (let i=0; i<await selects.count(); i++) {
              const sel=selects.nth(i);
              const opts=await sel.locator('option').allTextContents();
              const idx=opts.findIndex(x=>/MIT/i.test(x));
              if(idx>=0){await sel.selectOption({index:idx});licenseOk=true;break;}
            }

            // Leave optional Company/honeypot inputs blank. Confirm only the factual license/repository declaration.
            const checkboxes = form.locator('input[type="checkbox"]');
            for (let i=0; i<await checkboxes.count(); i++) {
              const cb=checkboxes.nth(i);
              if(await cb.isVisible().catch(()=>false) && !await cb.isChecked().catch(()=>true)) {
                const id=await cb.getAttribute('id');
                let label='';
                if(id){const lab=page.locator(`label[for="${id}"]`); if(await lab.count()) label=await lab.innerText();}
                if(/public repo|open-source license|license/i.test(label) || (await cb.isRequired().catch(()=>false))) await cb.check();
              }
            }

            if(!nameOk || !repoOk || !whatOk || !licenseOk) throw new Error(`Required public project fields incomplete (name=${nameOk}, repo=${repoOk}, what=${whatOk}, license=${licenseOk}).`);
            await page.waitForTimeout(2000);
            if(!await btn.isEnabled()) throw new Error('Submit free button remained disabled after public project facts were filled.');
            await btn.click({timeout:30000});
            await page.waitForTimeout(6000);
            r.submitted=true;
            r.finalUrl=page.url();
            r.bodyText=(await page.locator('body').innerText()).slice(0,12000);
            const combined=`${r.finalUrl}\n${r.bodyText}`;
            const fail=/submission failed|could not submit|invalid repository|error submitting/i.test(combined);
            r.successSignal=/thank you|submitted|under review|received|review queue|success/i.test(combined) && !fail;
          } catch(e) {
            r.error=String(e?.message||e);
            try{r.finalUrl=page.url();r.bodyText=(await page.locator('body').innerText()).slice(0,12000);}catch{}
          } finally {
            fs.writeFileSync('/tmp/opensourcechoice.json',JSON.stringify(r,null,2));
            await browser.close();
          }
          EOF
          node submit.mjs || true
          rm -f submit.mjs

      - name: Write acquisition audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          {
            echo '# OpenSourceChoice acquisition submission'
            echo
            echo "Attempted: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo 'Public open-source project facts only. No account, person/email identity, payment, private credential, unsolicited comment, or human-verification bypass was used.'
            echo
            echo '```json'
            jq . /tmp/opensourcechoice.json
            echo '```'
          } > ops/opensourcechoice-submission.md

      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/opensourcechoice-submission.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record OpenSourceChoice acquisition submission'
          git pull --rebase origin main
          git push
