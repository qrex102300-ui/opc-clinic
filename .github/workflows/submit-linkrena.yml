name: Verify OPC Clinic on Linkrena

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/submit-linkrena.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Linkrena directory presence
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          body="$(mktemp)"
          code="$(curl -sS -L -o "$body" -w '%{http_code}' 'https://linkrena.com/api/v1/tools?q=OPC%20Clinic')"
          listed=false
          if grep -Fq 'qrex102300-ui.github.io/opc-clinic' "$body"; then
            listed=true
          fi
          {
            echo '# Linkrena acquisition verification'
            echo
            echo "Last checked: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo 'A single no-account/no-card submission attempt was made through Linkrena’s designated public form earlier in this sprint. This workflow is verification-only and will not resubmit, avoiding duplicate/spam submissions.'
            echo
            echo "Verification HTTP status: $code"
            echo "Confirmed listed: $listed"
            echo
            echo '```json'
            head -c 6000 "$body" || true
            echo
            echo '```'
          } > ops/linkrena-submission.md

      - name: Commit verification audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/linkrena-submission.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record Linkrena listing verification'
          git pull --rebase origin main
          git push
