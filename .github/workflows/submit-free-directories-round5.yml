name: Submit OPC Clinic to Free Directories Round 5

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/submit-free-directories-round5.yml"

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then echo 'No Chromium-family browser found.' >&2; exit 1; fi
          echo "BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"

      - name: Probe and submit only where identity-free
        shell: bash
        run: |
          set -euo pipefail
          cat > round5.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const product = {
            name: 'OPC Clinic',
            url: 'https://qrex102300-ui.github.io/opc-clinic/',
            tagline: 'Evidence-backed diagnosis for launched products stuck before revenue.',
            description: 'OPC Clinic is an open-source AI founder diagnostician for launched products that have users, demos, or positive feedback but no reliable revenue. It traces the likely bottleneck to supplied facts and current market evidence, then turns the diagnosis into a measurable 7-day experiment with an explicit pass/fail rule.'
          };

          const surfaces = [
            {id:'masteraifinder', start:'https://masteraifinder.com/', navigate:true},
            {id:'switchtools', start:'https://www.switchtools.io/submit', navigate:false},
            {id:'seowebtoolkits', start:'https://www.seowebtoolkits.com/', navigate:true}
          ];

          const browser = await chromium.launch({headless:true, executablePath:process.env.BROWSER_EXECUTABLE, args:['--no-sandbox']});

          async function metaFor(el) {
            const id = await el.getAttribute('id');
            let label = '';
            if (id) label = await el.page().locator(`label[for="${id.replaceAll('"','\\"')}"]`).first().innerText().catch(()=> '');
            const aria = await el.getAttribute('aria-label') || '';
            const ph = await el.getAttribute('placeholder') || '';
            const name = await el.getAttribute('name') || '';
            const type = await el.getAttribute('type') || '';
            return `${label} ${aria} ${ph} ${name} ${type}`.toLowerCase();
          }

          async function identityGate(page) {
            const els = page.locator('input[required], textarea[required], select[required]');
            const gates=[];
            for (let i=0;i<await els.count();i++) {
              const el=els.nth(i); const meta=await metaFor(el);
              if (/\bemail\b|e-mail|your name|founder name|maker name|owner name|contact name|submitted by|short bio|about you|linkedin|twitter.*required|x handle.*required/.test(meta)) gates.push(meta.trim());
            }
            return gates;
          }

          async function fillFirst(page, selectors, value) {
            for (const s of selectors) {
              try {
                const loc = typeof s === 'string' ? page.locator(s) : s;
                if (await loc.count()) {
                  const el=loc.first();
                  if (await el.isVisible() && await el.isEditable()) { await el.fill(value); await el.press('Tab').catch(()=>{}); return true; }
                }
              } catch {}
            }
            return false;
          }

          async function chooseSelect(page, pattern, optionsPattern) {
            const selects=page.locator('select');
            for(let i=0;i<await selects.count();i++){
              const sel=selects.nth(i); const meta=await metaFor(sel);
              if(pattern && !pattern.test(meta)) continue;
              const opts=await sel.locator('option').allTextContents();
              let idx=opts.findIndex(x=>optionsPattern.test(x));
              if(idx<0) continue;
              await sel.selectOption({index:idx}).catch(()=>{}); return true;
            }
            return false;
          }

          async function navigateToForm(page, surface) {
            await page.goto(surface.start,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(2200);
            if(!surface.navigate) return;
            const candidates=[
              page.getByRole('link',{name:/submit your ai website|list ai tool|submit your tool|submit a company|submit.*tool|list.*free/i}),
              page.getByRole('button',{name:/submit your ai website|list ai tool|submit your tool|submit a company|submit.*tool|list.*free/i}),
              page.locator('a[href*="submit" i], a[href*="add-tool" i], a[href*="add_company" i]')
            ];
            for(const c of candidates){
              try { if(await c.count()){ await c.first().click({timeout:15000}); await page.waitForTimeout(2200); return; } } catch {}
            }
          }

          async function unfilledRequired(page){
            const els=page.locator('input[required], textarea[required], select[required]'); const missing=[];
            for(let i=0;i<await els.count();i++){
              const el=els.nth(i); if(!(await el.isVisible().catch(()=>false))) continue;
              const type=(await el.getAttribute('type')||'').toLowerCase();
              if(['checkbox','radio'].includes(type)) { if(!(await el.isChecked().catch(()=>false))) missing.push(await metaFor(el)); continue; }
              const val=await el.inputValue().catch(()=> ''); if(!String(val).trim()) missing.push(await metaFor(el));
            }
            return missing;
          }

          async function run(surface) {
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const r={id:surface.id,start:surface.start,attempted:true,submitted:false,successSignal:false,skippedForIdentity:false,identityFields:[],blockedByHumanVerification:false,finalUrl:null,error:null,missingRequired:[],bodyText:''};
            try {
              await navigateToForm(page,surface);
              let body=(await page.locator('body').innerText()).slice(0,16000);
              if(/captcha|turnstile|verify you are human|cloudflare challenge|hcaptcha|recaptcha/i.test(body)) { r.blockedByHumanVerification=true; throw new Error('Human-verification gate detected; no bypass attempted.'); }
              r.identityFields=await identityGate(page);
              if(r.identityFields.length){r.skippedForIdentity=true;r.bodyText=body;r.finalUrl=page.url();return r;}

              await fillFirst(page,[page.getByLabel(/tool name|website name|product name|company name|name of.*tool|name of.*website/i),'input[name*="tool_name" i]','input[name*="product_name" i]','input[name*="company_name" i]'],product.name);
              await fillFirst(page,[page.getByLabel(/website url|tool url|product url|company url|website link|url/i),'input[type="url"]','input[name*="url" i]','input[name*="website" i]'],product.url);
              await fillFirst(page,[page.getByLabel(/tagline|short description|one.line|headline/i),'input[name*="tagline" i]','input[name*="short" i]'],product.tagline);
              await fillFirst(page,[page.getByLabel(/description|what.*does|about.*tool/i),'textarea[name*="description" i]','textarea'],product.description);
              await chooseSelect(page,/category|type/i,/business|productivity|ai|artificial intelligence|saas|startup/i);
              await chooseSelect(page,/pricing|price/i,/free|freemium|open source/i);

              // Never supply person/contact identity, credentials, payment, or social identity.
              r.identityFields=await identityGate(page);
              if(r.identityFields.length){r.skippedForIdentity=true;r.bodyText=(await page.locator('body').innerText()).slice(0,16000);r.finalUrl=page.url();return r;}

              r.missingRequired=await unfilledRequired(page);
              // Terms checkboxes are not identity, but do not consent on behalf of the owner. If required, stop.
              if(r.missingRequired.length){throw new Error('Required fields remain after public product facts only; no guessing or consent bypass attempted.');}

              const buttons=[
                page.getByRole('button',{name:/submit.*free|submit.*tool|submit.*company|submit website|add.*tool|send for review|submit/i}),
                page.locator('button[type="submit"], input[type="submit"]')
              ];
              let btn=null;
              for(const b of buttons){if(await b.count()){btn=b.first();break;}}
              if(!btn) throw new Error('Submit control not found.');
              if(!(await btn.isEnabled().catch(()=>false))) throw new Error('Submit control remained disabled; no bypass attempted.');
              await page.waitForTimeout(2500);
              await btn.click({timeout:30000});
              await page.waitForTimeout(6000);
              r.submitted=true; r.finalUrl=page.url(); r.bodyText=(await page.locator('body').innerText()).slice(0,16000);
              r.blockedByHumanVerification=/captcha|turnstile|verify you are human|cloudflare challenge|hcaptcha|recaptcha/i.test(r.bodyText);
              const all=`${r.finalUrl}\n${r.bodyText}`;
              const failure=/error|invalid|failed|please enter|required field|sign in|log in|payment required/i.test(all);
              r.successSignal=/thank you|thanks|submitted|submission received|under review|review.*submission|success|we.?ll review|listed/i.test(r.bodyText)&&!failure&&!r.blockedByHumanVerification;
            } catch(e){r.error=String(e?.message||e);try{r.finalUrl=page.url();r.bodyText=(await page.locator('body').innerText()).slice(0,16000);}catch{}}
            finally{await page.close();}
            return r;
          }

          const results=[];
          for(const surface of surfaces) results.push(await run(surface));
          fs.writeFileSync('/tmp/round5.json',JSON.stringify(results,null,2));
          await browser.close();
          EOF
          node round5.mjs || true
          rm -f round5.mjs

      - name: Write acquisition audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          {
            echo '# Free directory acquisition round 5'
            echo
            echo "Last attempted: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo 'This run targeted newly screened, zero-cost discovery surfaces. The browser was allowed to submit only public product facts. It stopped on required person/email/social identity, consent fields, payment, login, CAPTCHA/human verification, disabled controls, or unknown required fields.'
            echo
            echo '```json'
            jq . /tmp/round5.json
            echo '```'
          } > ops/free-directory-round5.md

      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/free-directory-round5.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record free directory acquisition round 5'
          git pull --rebase origin main
          git push
