name: Probe SaaS Scout submission route

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/probe-saasscout.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect public no-login submission surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          page="$(mktemp)"
          code="$(curl -sS -L -o "$page" -w '%{http_code}' 'https://saasscout.org/submit')"
          scripts="$(mktemp)"
          grep -Eo 'src="[^"]+\.js[^"]*"' "$page" | sed -E 's/^src="//;s/"$//' | sort -u > "$scripts" || true
          signals="$(mktemp)"
          while IFS= read -r src; do
            [ -n "$src" ] || continue
            case "$src" in
              http://*|https://*) url="$src" ;;
              /*) url="https://saasscout.org$src" ;;
              *) url="https://saasscout.org/$src" ;;
            esac
            js="$(mktemp)"
            if curl -sS -L --max-time 15 -o "$js" "$url"; then
              grep -Eo '.{0,100}(submit|submission|/api/|email|website|url).{0,180}' "$js" | head -n 80 >> "$signals" || true
            fi
            rm -f "$js"
          done < "$scripts"
          {
            echo '# SaaS Scout submission-route audit'
            echo
            echo "Checked: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo 'Purpose: verify whether the public no-login submission flow can be used without supplying an email, account, payment, or private identity.'
            echo
            echo "HTTP status: $code"
            echo
            echo '## Server-rendered structural signals'
            echo
            grep -Eio '<form[^>]*>|action="[^"]+"|method="[^"]+"|name="[^"]+"|type="email"|/api/[A-Za-z0-9_/?=&.-]+' "$page" | head -n 120 || true
            echo
            echo '## Client-script endpoint signals'
            echo
            sed -E 's/[[:space:]]+/ /g' "$signals" | grep -Ei 'submit|submission|/api/|email' | head -n 120 || true
            echo
            echo '## Decision'
            if grep -Eqi 'type=["'"']?email|name=["'"'][^"'"']*email' "$page" || grep -Eqi 'email' "$signals"; then
              echo 'An email-related signal exists in the public submission code. No submission was made because the sprint must not use a private contact identity without authorization.'
            else
              echo 'No email field was detected, but no unambiguous public POST contract was proven yet. No submission was made.'
            fi
          } > ops/saasscout-submission-route.md

      - name: Commit audit record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/saasscout-submission-route.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Deepen SaaS Scout submission-route audit'
          git push
