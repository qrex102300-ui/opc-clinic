name: Probe SaaS Scout submission route

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/probe-saasscout.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify public submission API contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          categories_body="$(mktemp)"
          categories_code="$(curl -sS -L -o "$categories_body" -w '%{http_code}' 'https://saasscout.org/api/categories')"

          scrape_body="$(mktemp)"
          scrape_code="$(curl -sS -L -o "$scrape_body" -w '%{http_code}' \
            -X POST 'https://saasscout.org/api/scrape-metadata' \
            -H 'Content-Type: application/json' \
            --data '{"url":"https://qrex102300-ui.github.io/opc-clinic/","website":"https://qrex102300-ui.github.io/opc-clinic/"}')"

          validation_body="$(mktemp)"
          validation_code="$(curl -sS -L -o "$validation_body" -w '%{http_code}' \
            -X POST 'https://saasscout.org/api/products' \
            -H 'Content-Type: application/json' \
            --data '{}')"

          {
            echo '# SaaS Scout submission-route audit'
            echo
            echo "Checked: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo 'Purpose: verify the documented no-login submission flow without using an email, account, payment, or private identity. No real product submission is made in this probe.'
            echo
            echo '## Categories endpoint'
            echo
            echo "HTTP status: $categories_code"
            echo '```json'
            if jq -e . "$categories_body" >/dev/null 2>&1; then jq -c . "$categories_body"; else head -c 2000 "$categories_body"; fi
            echo
            echo '```'
            echo
            echo '## Metadata endpoint for OPC Clinic public URL'
            echo
            echo "HTTP status: $scrape_code"
            echo '```json'
            if jq -e . "$scrape_body" >/dev/null 2>&1; then jq -c . "$scrape_body"; else head -c 3000 "$scrape_body"; fi
            echo
            echo '```'
            echo
            echo '## Empty-payload validation probe'
            echo
            echo "HTTP status: $validation_code"
            echo '```json'
            if jq -e . "$validation_body" >/dev/null 2>&1; then jq -c . "$validation_body"; else head -c 3000 "$validation_body"; fi
            echo
            echo '```'
            echo
            echo '## Decision'
            if grep -Eqi 'email' "$validation_body"; then
              echo 'The product API validation references an email field. No real submission was made.'
            else
              echo 'The empty-payload validator does not expose an email requirement. A real submission still requires a complete validated payload; this probe does not create one.'
            fi
          } > ops/saasscout-submission-route.md

      - name: Commit audit record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/saasscout-submission-route.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Verify SaaS Scout public API contract'
          git push
