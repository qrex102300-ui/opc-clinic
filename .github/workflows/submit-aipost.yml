name: Submit OPC Clinic to AIPO.ST

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/submit-aipost.yml"

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Submit through documented agent API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          body="$(mktemp)"
          code="$(curl -sS -L -o "$body" -w '%{http_code}' \
            -X POST 'https://aipo.st/api/submit' \
            -H 'Content-Type: application/json' \
            --data '{"url":"https://qrex102300-ui.github.io/opc-clinic/","source":"agent"}')"

          # Keep the public audit receipt, but do not fail merely because the directory
          # returns a duplicate/rate-limit response; those are useful evidence too.
          {
            echo '# AIPO.ST acquisition submission audit'
            echo
            echo "Last attempted: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo 'Surface: https://aipo.st/submit-agent — documented public agent-submission API.'
            echo 'No account, email, payment, private credential, or identity claim was supplied.'
            echo 'Submitted URL: https://qrex102300-ui.github.io/opc-clinic/'
            echo
            echo "HTTP status: $code"
            echo
            echo '```json'
            if jq -e . "$body" >/dev/null 2>&1; then
              jq . "$body"
            else
              head -c 8000 "$body" || true
            fi
            echo
            echo '```'
          } > ops/aipost-submission.md

      - name: Commit acquisition audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/aipost-submission.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record AIPO.ST directory submission'
          git pull --rebase origin main
          git push
